.values{display:flex;gap:10px;font-size:.78rem;font-weight:500}
.values span:nth-child(1){color:var(--blue)}.values span:nth-child(2){color:var(--green)}.values span:nth-child(3){color:var(--red)}
.tri{display:flex;height:3px;margin-top:10px}
.tri i{flex:1}.tri i:nth-child(1){background:var(--blue)}.tri i:nth-child(2){background:var(--green)}.tri i:nth-child(3){background:var(--red)}
h1{font-size:2.3rem;font-weight:900;margin:22px 0 2px;letter-spacing:.12em}
.role{color:var(--muted);font-size:.9rem;margin:0}
.co{font-weight:900;font-size:1.05rem;margin:14px 0 0;letter-spacing:.02em}
dl{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule);display:grid;grid-template-columns:3.4em 1fr;gap:8px 10px;font-size:.92rem}
dt{color:var(--muted);font-size:.78rem;padding-top:.15em}
dd{margin:0;word-break:break-word}
dd a{color:var(--blue);text-decoration:none}
.bar{background:var(--red);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 22px}
.bar a{color:#fff;font-weight:900;text-decoration:none;letter-spacing:.06em}
.bar span{font-size:.8rem;letter-spacing:.2em}
.actions{width:100%;max-width:380px;margin-top:22px;display:grid;gap:10px}
button,.btn{font:inherit;font-weight:500;font-size:1rem;border:0;border-radius:10px;padding:14px;cursor:pointer;text-align:center;text-decoration:none;display:block}
#share{background:var(--line);color:#fff;font-size:1.05rem}
#share:disabled{opacity:.5;cursor:default}
.btn{background:var(--paper);color:var(--ink);border:1px solid var(--rule)}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#status{min-height:1.4em;margin:6px 0 0;text-align:center;color:var(--muted);font-size:.88rem}

function buildMessage(){
  let s = JSON.stringify(FLEX_TEMPLATE)
    .replaceAll("ttps://line.me/ti/p/aU9sNNkdHA", CONFIG.LINE_URL)
    .replaceAll("https://liff.line.me/2012828683-QWZ6IfzI", "https://liff.line.me/" + CONFIG.LIFF_ID);
  return JSON.parse(s);
}

const statusEl = document.getElementById("status");
const shareBtn = document.getElementById("share");
const say = t => statusEl.textContent = t;

async function main(){
  try{
    await liff.init({ liffId: CONFIG.LIFF_ID });
  }catch(e){
    say("LIFF 初始化失敗：請確認 LIFF ID 是否正確（" + e.message + "）");
    return;
  }
  if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
  if(!liff.isApiAvailable("shareTargetPicker")){
    say("請在 LINE 裡開啟這個頁面，或到 LINE Developers 開啟 shareTargetPicker。");
    return;
  }
  shareBtn.disabled = false;
  say("");
}

shareBtn.addEventListener("click", async () => {
  try{
    const res = await liff.shareTargetPicker([buildMessage()], { isMultiple: true });
    if(res){ say("名片已送出"); if(liff.isInClient()) setTimeout(()=>liff.closeWindow(), 1200); }
    else say("已取消傳送");
  }catch(e){
    say("傳送失敗：" + e.message);
  }
});

main();
